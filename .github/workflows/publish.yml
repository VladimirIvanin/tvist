name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Expected release tag v$version"
            exit 1
          fi
          if [[ "${version%%+*}" == *-* && "$PRERELEASE" != "true" ]]; then
            echo "::error::Mark this version as a GitHub pre-release"
            exit 1
          fi

      - run: npm ci
      - run: npm test -- --run
      - run: npm run build:browser
      - run: npm run test:package
      - run: npm run docs:build
      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/tvist-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish package
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish ./tvist-*.tgz --access public --tag "$DIST_TAG"
